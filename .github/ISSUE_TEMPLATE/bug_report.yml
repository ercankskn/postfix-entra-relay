name: Bug report
description: Report a reproducible defect without including secrets or message content.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste access tokens, refresh tokens, client secrets, private keys, full email bodies, or production recipient lists."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Postfix, External OAuth, HVE, SendAs, Reporting, Dashboard, Documentation]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: redacted_logs
    attributes:
      label: Redacted logs
      description: Remove tenant IDs, domains, addresses, IPs, tokens, and message bodies.
      render: text
