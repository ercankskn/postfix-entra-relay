name: Publish full source bootstrap

on:
  push:
    branches:
      - publish-full-source-v1
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-full-source.yml"
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-full-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-full-source-v1-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: publish-full-source-v1
          fetch-depth: 0

      - name: Assemble and diagnose current archive
        shell: bash
        run: |
          set -euo pipefail

          test "$(find .bootstrap/full-source -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 14

          mkdir -p /tmp/normalized-parts
          for part in .bootstrap/full-source/part-*.b64; do
            name="$(basename "$part")"
            tr -d '\r\n' < "$part" > "/tmp/normalized-parts/$name"
            printf '%s bytes=%s sha256=%s\n' \
              "$name" \
              "$(wc -c < "/tmp/normalized-parts/$name")" \
              "$(sha256sum "/tmp/normalized-parts/$name" | awk '{print $1}')"
          done

          cat /tmp/normalized-parts/part-*.b64 > /tmp/full-source.b64
          echo "ASSEMBLED_BYTES=$(wc -c < /tmp/full-source.b64)"
          echo "ASSEMBLED_SHA256=$(sha256sum /tmp/full-source.b64 | awk '{print $1}')"

          test "$(wc -c < /tmp/full-source.b64)" -eq 166628
          base64 --decode /tmp/full-source.b64 > /tmp/full-source.tar.gz

          echo "ARCHIVE_BYTES=$(wc -c < /tmp/full-source.tar.gz)"
          echo "ARCHIVE_SHA256=$(sha256sum /tmp/full-source.tar.gz | awk '{print $1}')"
          gzip -t /tmp/full-source.tar.gz

      - name: Inspect archive safely
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/full-source.tar.gz')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              if not members:
                  raise SystemExit('archive is empty')

              for member in members:
                  name = member.name
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {name}')
                  if member.isdev():
                      raise SystemExit(f'device entry is not allowed: {name}')

          print(f'ARCHIVE_MEMBERS_OK={len(members)}')
          PY

          rm -rf /tmp/full-source-tree
          mkdir -p /tmp/full-source-tree
          tar -xzf /tmp/full-source.tar.gz -C /tmp/full-source-tree

      - name: Validate reconstructed project
        shell: bash
        run: |
          set -euo pipefail

          test -f /tmp/full-source-tree/README.md
          test -f /tmp/full-source-tree/.github/workflows/ci.yml
          test -f /tmp/full-source-tree/src/postfix_entra_hve_submit.py
          test -f /tmp/full-source-tree/dashboard/app.py
          test -x /tmp/full-source-tree/tests/run.sh
          test -x /tmp/full-source-tree/scripts/linux/secret-scan.sh

          cd /tmp/full-source-tree
          ./tests/run.sh
          ./scripts/linux/secret-scan.sh .

          echo "PUBLIC_FILES=$(find . -type f | wc -l)"

      - name: Replace bootstrap tree with validated project
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/full-source-tree/. .

      - name: Publish full source commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Full source tree is already published."
            exit 0
          fi

          git commit -m "feat: publish complete v1.0.0 source tree"
          git push origin HEAD:publish-full-source-v1
