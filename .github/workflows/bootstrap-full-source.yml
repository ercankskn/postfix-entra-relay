name: Publish validated source tree

on:
  push:
    branches:
      - publish-full-source-v1
    paths:
      - ".bootstrap/rebuild/**"
      - ".github/workflows/bootstrap-full-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-validated-source-tree
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publish-full-source-v1
          fetch-depth: 0

      - name: Verify staged archive parts
        shell: bash
        run: |
          set -euo pipefail

          test "$(wc -c < .bootstrap/rebuild/part-00.b64)" -eq 7000
          test "$(wc -c < .bootstrap/rebuild/part-01.b64)" -eq 7000
          test "$(wc -c < .bootstrap/rebuild/part-02.b64)" -eq 7000
          test "$(wc -c < .bootstrap/rebuild/part-03.b64)" -eq 3684

          printf '%s  %s\n' \
            '11c19d882b2dc7583597ebdb02ac1512cf0ad73cebd84f8064566b20aebd563f' '.bootstrap/rebuild/part-00.b64' \
            'e31a5ac54abaecabb1ab645f01b4388498281412607cdbec5a90df605f59b2d3' '.bootstrap/rebuild/part-01.b64' \
            '11c647e3ddd03223548ade05860315f50af79f84b22a49e795e0c96bdb78d19b' '.bootstrap/rebuild/part-02.b64' \
            'b18f7768a054eb1314d9eccdf5107856d969062c9977d30b2e4505efe82b9ee7' '.bootstrap/rebuild/part-03.b64' \
          | sha256sum -c -

          cat .bootstrap/rebuild/part-*.b64 > /tmp/source-overlay.b64
          test "$(wc -c < /tmp/source-overlay.b64)" -eq 24684
          echo 'ce13a9902cfed720156f6f32397cc310f8521beb5128fbd0a5b1b2e54f151a45  /tmp/source-overlay.b64' \
            | sha256sum -c -

      - name: Decode and inspect archive safely
        shell: bash
        run: |
          set -euo pipefail

          base64 --decode /tmp/source-overlay.b64 > /tmp/source-overlay.tar.gz
          test "$(wc -c < /tmp/source-overlay.tar.gz)" -eq 18513
          echo 'a99e6d1c166a30b60161e626708fd9b4b36b2b215c37842f371df551aa7ba4b3  /tmp/source-overlay.tar.gz' \
            | sha256sum -c -
          gzip -t /tmp/source-overlay.tar.gz

          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path('/tmp/source-overlay.tar.gz')
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              if not members:
                  raise SystemExit('archive is empty')

              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.isdev():
                      raise SystemExit(f'device entry is not allowed: {member.name}')

          print(f'ARCHIVE_MEMBERS_OK={len(members)}')
          PY

      - name: Restore full source tree
        shell: bash
        run: |
          set -euo pipefail

          tar -xzf /tmp/source-overlay.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-full-source.yml

          test -f src/postfix_entra_hve_submit.py
          test -f src/postfix_entra_daily_origin_report.py
          test -f dashboard/app.py
          test -f dashboard/collector.py
          test -x tests/run.sh
          test -x scripts/linux/secret-scan.sh
          test -f .github/workflows/ci.yml

      - name: Test restored repository
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run.sh
          ./scripts/linux/secret-scan.sh .

      - name: Publish restored source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo 'No publication changes found.'
            exit 0
          fi

          git commit -m 'feat: restore complete v1.0.0 source tree'
          git push origin HEAD:publish-full-source-v1
