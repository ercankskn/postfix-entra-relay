name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck nodejs
      - name: Run repository tests
        run: ./tests/run.sh
      - name: ShellCheck
        run: shellcheck scripts/linux/*.sh tests/run.sh
      - name: Public-tree secret scan
        run: ./scripts/linux/secret-scan.sh .

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorsFound = @()
          Get-ChildItem scripts/powershell -Filter *.ps1 | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$Errors)
            if ($Errors.Count -gt 0) {
              $ErrorsFound += $Errors
            }
          }
          if ($ErrorsFound.Count -gt 0) {
            $ErrorsFound | Format-List
            exit 1
          }
          Write-Host "POWERSHELL_PARSE_OK"
