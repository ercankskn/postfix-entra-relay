name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate required files
        run: |
          set -euo pipefail
          test -f README.md
          test -f README.en.md
          test -f SECURITY.md
          test -f LICENSE
          test -f docs/tr/DEPLOYMENT_GUIDE.md
          test -f docs/en/deployment-guide.md
          test -f docs/screenshots/dashboard-overview.svg
          test -f docs/screenshots/dashboard-live-throughput.svg
          test -f docs/screenshots/dashboard-flow-health.svg
          grep -q 'docs/screenshots/dashboard-overview.svg' README.md
          grep -q 'docs/screenshots/dashboard-live-throughput.svg' README.md
          grep -q 'docs/screenshots/dashboard-flow-health.svg' README.md
          echo 'PUBLICATION_TREE_OK'

      - name: Validate SVG files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = [
              Path('docs/screenshots/dashboard-overview.svg'),
              Path('docs/screenshots/dashboard-live-throughput.svg'),
              Path('docs/screenshots/dashboard-flow-health.svg'),
          ]

          for path in files:
              ET.parse(path)
              if path.stat().st_size < 100:
                  raise SystemExit(f'{path} is unexpectedly small')

          print('SVG_FILES_OK')
          PY
