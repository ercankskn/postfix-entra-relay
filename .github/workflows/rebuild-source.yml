name: Rebuild source tree

on:
  push:
    branches: [publish-full-source-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish-full-source-v1
          fetch-depth: 0

      - name: Verify and decode overlay
        shell: bash
        run: |
          set -euo pipefail
          cd .bootstrap/rebuild
          sha256sum -c <<'SUMS'
          11c19d882b2dc7583597ebdb02ac1512cf0ad73cebd84f8064566b20aebd563f  part-00.b64
          e31a5ac54abaecabb1ab645f01b4388498281412607cdbec5a90df605f59b2d3  part-01.b64
          11c647e3ddd03223548ade05860315f50af79f84b22a49e795e0c96bdb78d19b  part-02.b64
          b18f7768a054eb1314d9eccdf5107856d969062c9977d30b2e4505efe82b9ee7  part-03.b64
          SUMS
          cat part-*.b64 > /tmp/source-overlay.b64
          test "$(wc -c < /tmp/source-overlay.b64)" -eq 24684
          echo 'ce13a9902cfed720156f6f32397cc310f8521beb5128fbd0a5b1b2e54f151a45  /tmp/source-overlay.b64' | sha256sum -c -
          base64 -d /tmp/source-overlay.b64 > /tmp/source-overlay.tar.gz
          test "$(wc -c < /tmp/source-overlay.tar.gz)" -eq 18513
          echo 'a99e6d1c166a30b60161e626708fd9b4b36b2b215c37842f371df551aa7ba4b3  /tmp/source-overlay.tar.gz' | sha256sum -c -
          gzip -t /tmp/source-overlay.tar.gz

      - name: Restore and validate source
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import tarfile; h=tarfile.open('/tmp/source-overlay.tar.gz'); assert all(not m.name.startswith('/') and '..' not in m.name.split('/') and not m.isdev() for m in h.getmembers())"
          tar -xzf /tmp/source-overlay.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-full-source.yml
          rm -f .github/workflows/rebuild-source.yml
          test -f src/postfix_entra_hve_submit.py
          test -f dashboard/app.py
          test -x tests/run.sh
          ./tests/run.sh
          ./scripts/linux/secret-scan.sh .

      - name: Commit restored tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat: restore complete v1.0.0 source tree'
          git push origin HEAD:publish-full-source-v1
