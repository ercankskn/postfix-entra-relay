name: Publish v1.0.0 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/RELEASE_TRIGGER
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-v1.0.0-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.0
      TARGET_SHA: ecdc7c67643a58e650348435fdac96087e5dee2a
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "1.0.0"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          ./tests/run.sh
          ./scripts/linux/secret-scan.sh .

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$TARGET_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Postfix Entra Relay v1.0.0"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/linux/package-release.sh
          test -s release/postfix-entra-relay-v1.0.0.tar.gz
          test -s release/postfix-entra-relay-v1.0.0.zip
          test -s release/postfix-entra-relay-v1.0.0.bundle
          sha256sum -c release/SHA256SUMS

      - name: Write release notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          ## Postfix Entra Relay v1.0.0

          Initial production-oriented public release for recipient-based split mail routing through Microsoft 365.

          ### Included

          - OAuth client-credentials HVE pipe for tenant-internal recipients
          - Exchange Online SMTP AUTH + delegated OAuth path for external recipients
          - Per-recipient Postfix transport routing for mixed-recipient messages
          - Token caching, proactive refresh, and retry handling
          - Original sender preservation through sanitized relay headers
          - Linux installation, validation, packaging, and secret-scan scripts
          - Microsoft 365 PowerShell preparation and verification scripts
          - Daily original-sender reporting
          - Optional SQLite-backed read-only dashboard
          - English and Turkish deployment documentation
          - Automated unit, syntax, link, and public-secret checks

          ### Validation

          - 8 Python unit tests passed
          - Python compilation passed
          - Shell syntax checks passed
          - Markdown local-link validation passed
          - Public secret scan passed

          The repository contains placeholders and redacted examples only. Production tenant identifiers, credentials, tokens, customer domains, personal addresses, and production logs are not included.
          NOTES

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            release/postfix-entra-relay-v1.0.0.tar.gz
            release/postfix-entra-relay-v1.0.0.zip
            release/postfix-entra-relay-v1.0.0.bundle
            release/SHA256SUMS
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Postfix Entra Relay v1.0.0" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "Postfix Entra Relay v1.0.0" \
              --notes-file /tmp/release-notes.md \
              --verify-tag \
              --latest
          fi

      - name: Confirm release publication
        if: github.event_name == 'pull_request_target'
        shell: bash
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "RELEASE_PUBLISHED tag=v1.0.0 target=ecdc7c67643a58e650348435fdac96087e5dee2a assets=tar.gz,zip,bundle,SHA256SUMS"
