<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="t d"><title id="t">Flow health cards</title><desc id="d">Sanitized health view for Postfix, HVE, web and external recipient service.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061832"/><stop offset="1" stop-color="#0b2b58"/></linearGradient><style>.a{font-family:Segoe UI,Arial,sans-serif;fill:#fff}.m{font-family:Segoe UI,Arial,sans-serif;fill:#8fb0d8}.p{fill:#08244b;stroke:#24578e}.c{fill:#0a2b58;stroke:#2b5d94}.ok{fill:#4ade80}.cy{fill:#22d3ee}.bl{fill:#60a5fa}.vi{fill:#a78bfa}</style></defs><rect width="1400" height="420" fill="url(#b)"/><text x="36" y="46" class="m" font-size="14">AKIŞ SAĞLIĞI</text><text x="36" y="82" class="a" font-size="28" font-weight="700">Servis Bazlı Sağlık Görünümü</text><text x="36" y="108" class="m" font-size="14">Her kart tıklanabilir ve ayrı detay sayfasına gider.</text><g><rect x="36" y="140" width="310" height="220" rx="20" class="c"/><circle cx="74" cy="182" r="11" class="ok"/><text x="98" y="188" class="a" font-size="20" font-weight="700">Postfix</text><text x="60" y="228" class="m" font-size="13">Durum</text><text x="60" y="258" class="a" font-size="30" font-weight="700">Aktif</text><text x="60" y="300" class="m" font-size="13">Queue: 0</text><text x="60" y="326" class="m" font-size="13">Deferred: 0 · Bounced: 0</text></g><g><rect x="366" y="140" width="310" height="220" rx="20" class="c"/><circle cx="404" cy="182" r="11" class="cy"/><text x="428" y="188" class="a" font-size="20" font-weight="700">HVE</text><text x="390" y="228" class="m" font-size="13">OAuth ve teslimat</text><text x="390" y="258" class="a" font-size="30" font-weight="700">Sağlıklı</text><text x="390" y="300" class="m" font-size="13">Token refresh: hazır</text><text x="390" y="326" class="m" font-size="13">Son hata: yok</text></g><g><rect x="696" y="140" width="310" height="220" rx="20" class="c"/><circle cx=