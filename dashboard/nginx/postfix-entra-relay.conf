server {
    listen 443 ssl http2;
    server_name relay-dashboard.example.com;

    ssl_certificate     /etc/ssl/certs/relay-dashboard.crt;
    ssl_certificate_key /etc/ssl/private/relay-dashboard.key;

    auth_basic "Postfix Entra Relay";
    auth_basic_user_file /etc/nginx/.htpasswd-postfix-entra;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
